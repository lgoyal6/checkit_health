name: Keep backend warm

# Render's free tier spins the service down after ~15 min idle, so the next
# request pays a cold start. This job pings /health to wake it back up.
#
# The */10 schedule below is aspirational. GitHub throttles cron hard: measured
# gaps between actual runs were 20 to 107 min (median 36), so the service spins
# down between pings and nearly every ping is a cold boot. The retry budget is
# therefore sized to outlast a slow boot rather than to prevent one: 5 attempts
# of 90s, 30s apart, is ~9.5 min of tolerance. Both observed failure modes are
# retried by curl already (timeouts, and the 503 Render's edge serves while an
# instance boots). A real fix needs an off-GitHub pinger that actually fires on
# schedule.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 --retry 4 --retry-delay 30 \
            https://checkit-health-api.onrender.com/health
