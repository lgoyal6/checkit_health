name: Scheduled Bluesky monitoring

# Pulls fresh posts from Bluesky, runs the full classify -> falsifiability
# -> fact-check pipeline, and upserts the results into Postgres (Supabase) so
# the live monitor grows on its own. Runs every 6 hours; also triggerable by hand.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: Optional single Bluesky search query. Defaults to MONITOR_QUERIES.
        required: false
        default: ""
      limit:
        description: Max viral posts to process after ranking
        required: false
        default: "50"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline into Postgres
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_FACT_CHECK_KEY: ${{ secrets.GOOGLE_FACT_CHECK_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.query }}" ]; then
            python run.py \
              --source bluesky \
              --query "${{ github.event.inputs.query }}" \
              --limit "${{ github.event.inputs.limit || '50' }}"
          else
            python run.py \
              --source bluesky \
              --limit "${{ github.event.inputs.limit || '50' }}"
          fi
