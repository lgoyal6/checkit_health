# Render blueprint for the Checkit Health FastAPI backend.
# Deploy: push to GitHub, then in the Render dashboard "New +" -> "Blueprint"
# and point it at this repo (Blueprint Path: backend/render.yaml). Set the
# secret env vars (marked sync:false) in the dashboard after the first deploy.
#
# rootDir is backend/app because api.py and its sibling modules (config.py,
# storage.py, classifier.py, ...) use flat same-directory imports
# (`import config`, not `from . import config`), matching how the ingestion
# CLI and the GitHub Actions workflow already invoke them. buildCommand
# reaches up one level for requirements.txt, which lives in backend/.
services:
  - type: web
    name: checkit-health-api
    runtime: python
    plan: free
    rootDir: backend/app
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANALYST_API_KEY
        generateValue: true
      - key: EVIDENCE_RETRIEVAL_ENABLED
        value: "true"
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: BACKGROUND_WORKERS
        value: "4"
      - key: PYTHON_VERSION
        value: "3.11.9"
